<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formúlarios 2</title>
</head>
<body>
    <h1>Mais sobre Formulários</h1>
    <form action="processar.html" method="get">
        <h2>Label</h2>

        <label for="email">
           Nome: <input type="text" name="email" id="email">
        </label>
        <br> <br>
        <label for="genero">
            Gênero: <br>
            <input type="radio" name="genero" value="feminino" id="genero"> Feminino
            <input type="radio" name="genero" value="masculino" id="genero"> Masculino
        </label>
        <br> <br>
        <label for="estilo">
            Estilo Musical <br> <br>
            <input type="checkbox" name="estilo" value="rock" id="estilo"> Rock
            <input type="checkbox" name="estilo" value="sertanejo" id="estilo"> Sertanejo
            <input type="checkbox" name="estilo" value="gospel" id="estilo"> Gospel
        </label>
        <br> <br>

          <br>
        Estado:
         <select name="estado" id="">
            <option value="">Selecione</option>
            <option value="sp">São Paulo</option>
            <option value="bh">Belo Horizonte</option>
            <option value="trm">Três Marias</option>
            <option value="pm">Patos de Minas</option>
         </select>

         <br> <br>
         Upload de Arquivos: 
         <input type="file" value="Arquivos" name="arquivos">

         <br> <br>
        <input type="submit" name="cadastrar" value="cadastrar">

    
       <!--(name e value é para capturar os dados enviados, enquanto id é para identificar os valores)-->
    </form>

    <!--fieldset & legend = agrupa os formúlarios-->

    <form action="">
        <fieldset>
            <legend>Dados pessoais</legend>
            <label for="email2">
                Nome: <input type="text" name="email" id="email2">
            </label>

            <label for="genero2"> <br>
                Gênero: <br>
                <input type="radio" name="genero" value="feminino" id="genero2"> Feminino
                <input type="radio" name="genero" value="masculino" id="genero2"> Masculino
            </label>
        </fieldset>
    </form>

   

</body>
</html>
