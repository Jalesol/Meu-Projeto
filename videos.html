<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos</title>
</head>
<body>
    <h1>Executando vídeos</h1>
    <!--
      source -> Fonte
      controls -> controles
      muted -> mudo
      autoplay -> reprodução automática
      loop -> ciclo
      poster -> cartaz
    -->
    <video width="400" controls muted  loop poster="assets/Fone de ouvido.webp" src="videos/abelhas (1).mp4"></video>

    <!--Pegando do Youtube-->

    <iframe width="400" height="315" src="https://www.youtube-nocookie.com/embed/2olz2kA4Bl8?si=6oqVaO7bLBGmqszQ"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
